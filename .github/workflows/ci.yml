name: Test and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: examples/browser/package-lock.json
      - name: Install browser example dependency without scripts
        run: npm ci --ignore-scripts --prefix examples/browser
      - name: Configure available browser for actual integration tests
        shell: python
        run: |
          import os, pathlib, shutil
          node = shutil.which('node')
          candidates = [shutil.which(name) for name in ('google-chrome', 'chromium', 'chromium-browser')]
          for variable in ('PROGRAMFILES', 'PROGRAMFILES(X86)'):
              base = os.environ.get(variable)
              if base:
                  candidates.append(str(pathlib.Path(base) / 'Microsoft/Edge/Application/msedge.exe'))
                  candidates.append(str(pathlib.Path(base) / 'Google/Chrome/Application/chrome.exe'))
          browser = next((path for path in candidates if path and pathlib.Path(path).is_file()), None)
          if node and browser:
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
                  stream.write(f'BROWSER_MCP_NODE={node}\nBROWSER_MCP_EXECUTABLE={browser}\n')
              print('Actual browser integration tests enabled')
          else:
              print('No supported browser installed; browser integration tests will explicitly skip')
      - name: Install real FFmpeg for Linux integration tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install locked test dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Install adapter
        run: python -m pip install --no-deps -e ./adapters/lammps
      - name: Test skill, examples, adapter, and release tooling
        run: python -m pytest skills/mcp-anything/tests adapters/lammps/tests examples scripts/tests -ra
      - name: Check source errors
        run: python -m ruff check --select E9,F63,F7,F82 skills adapters examples scripts
      - name: Build standalone skill without an adapter wheel
        run: python scripts/build_release.py --target skill --output dist/skill
      - name: Build installable adapter
        run: python -m build ./adapters/lammps
        env:
          SOURCE_DATE_EPOCH: '1793404800'
      - name: Build and verify source archives
        run: python scripts/build_release.py --output dist
